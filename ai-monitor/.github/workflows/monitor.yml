name: SarkariSetu Monitor

on:
  schedule:
    # हर 3 घंटे में (govt sites पर gentle रहने के लिए)
    - cron: "17 */3 * * *"
  workflow_dispatch: {}

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        working-directory: ai-monitor
        run: pip install -r requirements.txt

      - name: Run monitoring engine
        working-directory: ai-monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 src/monitor.py

      - name: Run official site detection (light pass)
        working-directory: ai-monitor
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python3 src/detect_official_sites.py
